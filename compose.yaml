# LogUnify full stack (single host). See deploy/README.md for the air-gapped workflow.
#
#   cp deploy/.env.example .env && edit it (LOGUNIFY_JWT_SECRET is required)
#   docker compose up -d                       # kafka + topics + backend + dashboard
#   docker compose --profile flink up -d       # + PyFlink noise-reduction / dedup job (needs logunify-flink/jars/*.jar: deploy/fetch-jars.sh)
#   docker compose --profile siem up -d        # + Vector forwarder to Elasticsearch / Splunk / Wazuh (needs ./secrets/*)
#
# Everything binds to 127.0.0.1 only: put a TLS-terminating reverse proxy in front for anything beyond one machine.
name: logunify

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp"]
  restart: unless-stopped

services:
  kafka:
    image: apache/kafka:3.9.1            # pin by digest for production (docker buildx imagetools inspect)
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"        # topics are created explicitly below, with real partition counts
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes: ["kafka-data:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-init:                            # one-shot: topics with enough partitions for the number of backend workers
    image: apache/kafka:3.9.1
    depends_on:
      kafka: {condition: service_healthy}
    restart: "no"
    environment:
      PARTITIONS: ${LOGUNIFY_PARTITIONS:-6}
      RAW_RETENTION_MS: ${LOGUNIFY_RAW_RETENTION_MS:-604800000}      # 7 days of replay window for the raw topic
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        K=/opt/kafka/bin/kafka-topics.sh; B=kafka:9092
        for t in logunify.raw logunify.ecs logunify.siem; do
          $$K --bootstrap-server $$B --create --if-not-exists --topic $$t --partitions $$PARTITIONS --replication-factor 1 \
              --config retention.ms=$$RAW_RETENTION_MS
        done
        for t in logunify.ecs.dlq logunify.siem.dedup-stats; do
          $$K --bootstrap-server $$B --create --if-not-exists --topic $$t --partitions 1 --replication-factor 1
        done
        $$K --bootstrap-server $$B --list

  backend:
    build: ./logunify-backend
    image: logunify/backend:${LOGUNIFY_VERSION:-dev}
    <<: *hardening
    depends_on:
      kafka-init: {condition: service_completed_successfully}
    environment:
      LOGUNIFY_KAFKA_ENABLED: "true"
      LOGUNIFY_KAFKA_BOOTSTRAP: kafka:9092
      LOGUNIFY_MOCK_ENABLED: ${LOGUNIFY_MOCK_ENABLED:-false}
      LOGUNIFY_AUTH_MODE: ${LOGUNIFY_AUTH_MODE:-jwt}
      LOGUNIFY_JWT_SECRET: ${LOGUNIFY_JWT_SECRET:-}      # HS256 shared secret (>= 32 bytes) and/or an IdP JWKS below; one of them is required
      LOGUNIFY_AUDIT_HMAC_KEY: ${LOGUNIFY_AUDIT_HMAC_KEY:-}
      LOGUNIFY_RAW_ARCHIVE_ENABLED: ${LOGUNIFY_RAW_ARCHIVE_ENABLED:-false}
      LOGUNIFY_RAW_ARCHIVE_KEY: ${LOGUNIFY_RAW_ARCHIVE_KEY:-}
      LOGUNIFY_WORKER_ID: auto                           # a stable slot per replica (w0, w1, ...) leased from /data/.slots: survives container re-creation
      LOGUNIFY_WORKER_SLOT_DIR: /data/.slots
      LOGUNIFY_AUTH_DB_PATH: /data/auth.db                # revocations are SHARED by all replicas (re-read every 5 s)
      LOGUNIFY_JWT_JWKS_FILE: ${LOGUNIFY_JWT_JWKS_FILE:-}
      LOGUNIFY_JWT_JWKS_URL: ${LOGUNIFY_JWT_JWKS_URL:-}
      LOGUNIFY_JWT_ISSUER: ${LOGUNIFY_JWT_ISSUER:-}
      LOGUNIFY_JWT_AUDIENCE: ${LOGUNIFY_JWT_AUDIENCE:-}
      LOGUNIFY_JWT_ROLES_CLAIM: ${LOGUNIFY_JWT_ROLES_CLAIM:-roles}
      LOGUNIFY_STATE_DB_PATH: /data/{worker}/state.db    # {worker} -> the id above: replicas never share a SQLite file
      LOGUNIFY_STATE_DATABASE_URL: ${LOGUNIFY_STATE_DATABASE_URL:-}   # postgresql://... : state in one shared PostgreSQL (schema per replica) instead of the file above
      LOGUNIFY_STATE_HMAC_KEY: ${LOGUNIFY_STATE_HMAC_KEY:-}           # authenticates saved Drain3/Isolation Forest blobs; without it models are not persisted
      LOGUNIFY_REDIS_URL: ${LOGUNIFY_REDIS_URL:-}                     # redis://... : LOGUNIFY_RATE_LIMIT_PER_MIN is enforced across all replicas
      LOGUNIFY_ALERT_DB_PATH: /data/{worker}/alerts.db
      LOGUNIFY_AUDIT_DB_PATH: /data/{worker}/audit.db
      LOGUNIFY_DLQ_PATH: /data/{worker}/dlq.jsonl
      LOGUNIFY_RAW_ARCHIVE_DIR: /data/{worker}/raw
      LOGUNIFY_PARSER_DIR: /parsers.d
      LOGUNIFY_CORS_ORIGINS: ${LOGUNIFY_CORS_ORIGINS:-}
      LOGUNIFY_TRUSTED_PROXIES: ${LOGUNIFY_TRUSTED_PROXIES:-}      # CIDRs whose X-Forwarded-For is believed (your reverse proxy / the dashboard network)
      LOGUNIFY_RATE_LIMIT_PER_MIN: ${LOGUNIFY_RATE_LIMIT_PER_MIN:-0}
      LOGUNIFY_DOCS_ENABLED: ${LOGUNIFY_DOCS_ENABLED:-false}
      LOGUNIFY_HSTS_ENABLED: ${LOGUNIFY_HSTS_ENABLED:-false}
    volumes:
      - backend-data:/data
      - ./parsers.d:/parsers.d:ro                         # drop declarative parsers here (see app/parsers/sdk.py)
      - ./logunify-forwarder:/opt/forwarder:ro            # retention policy files the compliance report parses
    networks: [default]

  dashboard:
    build: ./logunify-dashboard
    image: logunify/dashboard:${LOGUNIFY_VERSION:-dev}
    <<: *hardening
    tmpfs: ["/tmp", "/app/.next/cache"]
    depends_on:
      backend: {condition: service_healthy}
    environment:
      LOGUNIFY_API_URL: http://backend:8000
    ports: ["127.0.0.1:3000:3000"]

  flink:
    profiles: [flink]
    build: ./logunify-flink
    image: logunify/flink:${LOGUNIFY_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      kafka-init: {condition: service_completed_successfully}

  vector:
    profiles: [siem]
    build: ./logunify-forwarder
    image: logunify/forwarder:${LOGUNIFY_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      kafka-init: {condition: service_completed_successfully}
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      ES_URL: ${ES_URL:-}
      SPLUNK_HEC_URL: ${SPLUNK_HEC_URL:-}
      LOGUNIFY_ENV: ${LOGUNIFY_ENV:-prod}
    secrets: [es_authorization, splunk_hec_token]
    volumes: ["vector-data:/var/lib/vector", "wazuh-logs:/var/log/logunify"]

secrets:
  es_authorization: {file: "${LOGUNIFY_SECRETS_DIR:-./secrets}/es_authorization"}
  splunk_hec_token: {file: "${LOGUNIFY_SECRETS_DIR:-./secrets}/splunk_hec_token"}

volumes:
  kafka-data:
  backend-data:
  vector-data:
  wazuh-logs:
