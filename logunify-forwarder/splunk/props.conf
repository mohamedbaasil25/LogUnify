[logunify:ecs]
SHOULD_LINEMERGE = false
# HEC "event" endpoint supplies the time (from ECS @timestamp) and the JSON body; no timestamp parsing needed.
KV_MODE = json
TRUNCATE = 200000
category = Security
description = LogUnify ECS-mapped events (parsed, enriched, threat-intel matched)

# Minimal CIM-style aliases so existing Splunk content works on ECS field names
FIELDALIAS-logunify_src   = "source.ip" AS src
FIELDALIAS-logunify_dest  = "destination.ip" AS dest
FIELDALIAS-logunify_user  = "user.name" AS user
FIELDALIAS-logunify_act   = "event.action" AS action
FIELDALIAS-logunify_out   = "event.outcome" AS outcome
FIELDALIAS-logunify_score = "logunify.anomaly.score" AS anomaly_score
