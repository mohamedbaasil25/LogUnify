# LogUnify index on Splunk Enterprise: tiering + CERT-In 180-day retention.
#
# Splunk has no age-based tiering. Buckets roll hot -> warm -> cold by SIZE/count, so the tier sizes below are computed
# from the daily ingest volume (python retention/capacity.py). Retention is age-based: a bucket is frozen only when its
# NEWEST event is older than frozenTimePeriodInSecs, so every event lives at least that long.
#
# SIZED FOR ~300 EPS x 885 B/event (2.6 TB/180 d incl. 25% headroom). For your load run
#     python retention/capacity.py --eps <yours>      and CI:  python retention/policy_lint.py --eps <yours>
#
# GUARDRAIL: maxTotalDataSizeMB (and any volume cap) also freezes the oldest buckets when exceeded. If it triggers
# before 180 days you silently violate the retention policy. Size it with headroom; alert on it (docs/WORKFLOW.md).

[volume:hot_warm]
path = /splunk/ssd                       # NVMe/SSD: hot + warm (roughly the last 7-30 days)
maxVolumeDataSizeMB = 600000

[volume:cold]
path = /splunk/hdd                       # cheaper disk: cold (30-180 days)
maxVolumeDataSizeMB = 3000000

[logunify]
homePath   = volume:hot_warm/logunify/db
coldPath   = volume:cold/logunify/colddb
thawedPath = $SPLUNK_DB/logunify/thaweddb
datatype = event

# ---- retention: 180 days = 15,552,000 s (CERT-In Directions, 28 Apr 2022) -----------------------------------------
frozenTimePeriodInSecs = 15552000
# Never let size caps beat the age rule. 3,000,000 MB = 3 TB total; recompute with retention/capacity.py.
maxTotalDataSizeMB = 3000000
# Bound a bucket's time span to 1 day: freeze timing (and over-retention) is accurate to ~1 day, not 90.
maxHotSpanSecs = 86400
maxHotBuckets = 6

# ---- tiering by size -------------------------------------------------------------------------------------------
homePath.maxDataSizeMB = 350000          # hot+warm cap ~ 7-30 days of data; the oldest warm buckets then move to cold
maxWarmDBCount = 300

# ---- cost saver for old data: shrink tsidx files of buckets older than 30 days (searches on them get slower) ----
enableTsidxReduction = true
timePeriodInSecBeforeTsidxReduction = 2592000
tsidxWritingLevel = 4

# ---- archive instead of delete: frozen buckets are copied here (then removed from the index) -------------------
# Point this at cheap, encrypted, India-resident storage. Retention beyond 180 days is optional; delete per data-minimisation policy.
coldToFrozenDir = /splunk/frozen/logunify

# ---- indexer cluster: keep two copies of hot/warm, one of cold-archived data is covered by frozen archive ------
repFactor = auto

# ===================== ALTERNATIVE: SmartStore (S3, Mumbai) for the cold tier ======================================
# Local disk becomes a cache; the authoritative copy of every bucket lives in object storage. Uncomment together with
# a [volume:remote_store] stanza, and use maxGlobalDataSizeMB instead of maxTotalDataSizeMB.
#
# [volume:remote_store]
# storageType = remote
# path = s3://REPLACE-logunify-splunk-mumbai/
# remote.s3.endpoint = https://s3.ap-south-1.amazonaws.com
# remote.s3.encryption = sse-s3
# remote.s3.supports_versioning = false
#
# [logunify]
# remotePath = volume:remote_store/$_index_name
# hotlist_recency_secs = 604800              # keep the last 7 days cached locally
# hotlist_bloom_filter_recency_hours = 360
# maxGlobalDataSizeMB = 3000000
