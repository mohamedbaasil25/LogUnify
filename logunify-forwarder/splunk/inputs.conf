# HTTP Event Collector for the LogUnify forwarder (Vector splunk_hec_logs sink).
[http]
disabled = 0
port = 8088
enableSSL = 1                                   # never accept HEC over plain HTTP outside a lab
serverCert = $SPLUNK_HOME/etc/auth/logunify/hec.pem
sslVersions = tls1.2, tls1.3

[http://logunify-forwarder]
disabled = 0
# Placeholder, not a credential: Splunk does not expand environment variables, so render this file at deploy time:
#   export SPLUNK_HEC_TOKEN="$(uuidgen)"        # keep it in your secret manager
#   envsubst '${SPLUNK_HEC_TOKEN}' < inputs.conf > $SPLUNK_HOME/etc/apps/logunify/local/inputs.conf
# and give the SAME value to the forwarder's secret file (splunk_hec_token). Unrendered, Splunk rejects the token (fails closed).
token = ${SPLUNK_HEC_TOKEN}
index = logunify
indexes = logunify                              # least privilege: this token can write to this one index only
sourcetype = logunify:ecs
useACK = 1                                      # indexer acknowledgement: the forwarder only commits Kafka offsets after persistence
