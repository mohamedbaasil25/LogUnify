# Linux auditd (audit.log, or relayed through audisp-syslog with or without a syslog header). One record per line.
name: linux_auditd
version: "1.0.0"
kind: regex
description: "Linux auditd records (type=NAME msg=audit(epoch:serial): ...)"
priority: 15
sniff:
  regex: 'type=[A-Z_]+ msg=audit\(\d+\.\d+:\d+\)'
  confidence: 0.96
match:
  regex: '^(?:<\d{1,3}>)?(?:[A-Z][a-z]{2}\s+\d{1,2} \d\d:\d\d:\d\d \S+ (?:audispd|auditd)?:? ?)?(?:node=(?P<node>\S+) )?type=(?P<type>[A-Z_]+) msg=audit\((?P<ts>\d+\.\d+):(?P<serial>\d+)\): (?P<body>.*)$'
timestamp:
  field: ts
  format: epoch
message: "auditd {type}: {body}"
fields:
  host.name:           {from: node}
  event.action:        {from: type, transform: lower}
  labels.audit_serial: {from: serial}
rules:
  - when: {field: body, regex: 'res=(?:failed|0)\b'}
    set: {event.outcome: failure}
  - when: {field: body, regex: 'res=(?:success|1)\b'}
    set: {event.outcome: success}
  - when: {field: type, in: [USER_LOGIN, USER_AUTH, USER_ACCT, LOGIN, USER_START, USER_END, CRED_ACQ, CRED_DISP]}
    set: {event.category: [authentication]}
  - when: {field: type, in: [ADD_USER, DEL_USER, ADD_GROUP, DEL_GROUP, USER_CHAUTHTOK, USER_MGMT]}
    set: {event.category: [iam], event.type: [change]}
  - when: {field: type, in: [EXECVE, SYSCALL]}
    set: {event.category: [process], event.type: [start]}
  - when: {field: type, in: [CONFIG_CHANGE, MAC_POLICY_LOAD, ANOM_ABEND]}
    set: {event.category: [configuration], event.type: [change]}
static:
  event.kind: event
  event.module: auditd
  event.category: [host]
  event.type: [info]
