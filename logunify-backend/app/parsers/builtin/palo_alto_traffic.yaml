# Palo Alto Networks PAN-OS TRAFFIC log (syslog CSV), with or without a syslog header. Positional columns per the PAN-OS default
# format; custom log formats need their own parser. Timestamps are device-local (set the source timezone).
name: palo_alto_traffic
version: "1.0.0"
kind: regex
description: Palo Alto Networks PAN-OS TRAFFIC log (CSV)
priority: 18
sniff:
  regex: ',TRAFFIC,(?:start|end|drop|deny),'
  confidence: 0.97
match:
  regex: '^(?:<\d{1,3}>)?(?:[A-Z][a-z]{2}\s+\d{1,2} \d\d:\d\d:\d\d \S+ )?(?:\d+,)?(?P<recv>\d{4}/\d\d/\d\d \d\d:\d\d:\d\d),(?P<serial>[^,]*),TRAFFIC,(?P<subtype>[^,]*),[^,]*,(?P<gen>\d{4}/\d\d/\d\d \d\d:\d\d:\d\d),(?P<src>[^,]*),(?P<dst>[^,]*),(?P<natsrc>[^,]*),(?P<natdst>[^,]*),(?P<rule>[^,]*),(?P<srcuser>[^,]*),(?P<dstuser>[^,]*),(?P<app>[^,]*),(?P<vsys>[^,]*),(?P<zfrom>[^,]*),(?P<zto>[^,]*),(?P<inif>[^,]*),(?P<outif>[^,]*),[^,]*,[^,]*,(?P<session>[^,]*),[^,]*,(?P<sport>\d*),(?P<dport>\d*),[^,]*,[^,]*,[^,]*,(?P<proto>[^,]*),(?P<action>[^,]*)(?:,.*)?$'
timestamp:
  field: gen
  format: "%Y/%m/%d %H:%M:%S"
message: "{app} {action} {src} -> {dst} (rule {rule})"
fields:
  observer.serial_number:            {from: serial}
  observer.type:                     {value: firewall}
  observer.vendor:                   {value: Palo Alto Networks}
  source.ip:                         {from: src, type: ip}
  destination.ip:                    {from: dst, type: ip}
  source.nat.ip:                     {from: natsrc, type: ip, drop_if: ["0.0.0.0"]}
  destination.nat.ip:                {from: natdst, type: ip, drop_if: ["0.0.0.0"]}
  source.port:                       {from: sport, type: int}
  destination.port:                  {from: dport, type: int}
  network.transport:                 {from: proto, transform: lower}
  network.application:               {from: app, drop_if: [""]}
  rule.name:                         {from: rule}
  user.name:                         {from: srcuser, drop_if: [""]}
  observer.ingress.zone:             {from: zfrom}
  observer.egress.zone:              {from: zto}
  observer.ingress.interface.name:   {from: inif, drop_if: [""]}
  observer.egress.interface.name:    {from: outif, drop_if: [""]}
  event.action:                      {from: action, transform: lower}
  labels.pan_session_id:             {from: session}
  labels.pan_subtype:                {from: subtype}
rules:
  - when: {field: action, in: [deny, drop, reset-client, reset-server, reset-both, block-url]}
    set: {event.outcome: failure, event.type: [connection, denied]}
  - when: {field: action, equals: allow}
    set: {event.outcome: success, event.type: [connection, allowed]}
static:
  event.kind: event
  event.category: [network]
  event.type: [connection]
  event.module: panos
