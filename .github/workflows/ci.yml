# CI for LogUnify. NOTE: written and syntax-checked locally; it has not yet run on GitHub Actions: expect to adjust on first run.
name: ci

on:
  push: {branches: [main]}
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: logunify-backend}}
    services:                    # real PostgreSQL + Redis for the shared-state tests (throwaway, CI only)
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: ci, POSTGRES_DB: logunify_test}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LOGUNIFY_TEST_PG_URL: postgresql://postgres:ci@localhost:5432/logunify_test
      LOGUNIFY_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip, cache-dependency-path: logunify-backend/requirements-dev.txt}
      - run: pip install -r requirements-dev.txt
      - name: Lint (pyflakes errors, syntax, unsafe defaults)
        run: ruff check app tests scripts
      - name: Parser contract (golden fixtures + ECS validation of every shipped parser)
        run: python -m app.parsers.cli test --strict
      - name: Tests (without the Kafka suite)
        run: python -m pytest tests -q -m "not kafka"
      - name: Mutation check (PII redaction must catch 80% of sampled mutants)
        run: python scripts/mutation_test.py --target app/privacy/pii.py --tests tests/test_pii.py --sample 40 --min-score 0.8
      - name: Pipeline throughput gate (fails below 300 events/s; local one-core is ~1,600)
        run: python scripts/bench_pipeline.py --n 6000 --min-eps 300

  backend-kafka:
    runs-on: ubuntu-latest
    needs: backend
    defaults: {run: {working-directory: logunify-backend}}
    env:
      KAFKA_VERSION: "3.9.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip, cache-dependency-path: logunify-backend/requirements-dev.txt}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - run: pip install -r requirements-dev.txt
      - name: Fetch Kafka distribution
        run: |
          curl -fsSL "https://archive.apache.org/dist/kafka/${KAFKA_VERSION}/kafka_2.13-${KAFKA_VERSION}.tgz" -o /tmp/kafka.tgz
          tar -xzf /tmp/kafka.tgz -C "$RUNNER_TEMP"
          echo "LOGUNIFY_KAFKA_HOME=$RUNNER_TEMP/kafka_2.13-${KAFKA_VERSION}" >> "$GITHUB_ENV"
      - name: No-loss tests against a real broker (round trip, crash before commit, broker outage)
        run: python -m pytest tests -q -m kafka

  forwarder:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: logunify-forwarder}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install pytest pyyaml
      - run: python -m pytest tests -q
      - name: 180-day retention policy gate
        run: python retention/policy_lint.py --eps 300 --outage-hours 4

  flink:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: logunify-flink}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "11"}
      - run: pip install -r requirements.txt
      - run: bash ../deploy/fetch-jars.sh
      - run: python -m pytest tests -q

  dashboard:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: logunify-dashboard}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: logunify-dashboard/package-lock.json}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  e2e:
    # Real dashboard + real backend (scripts/e2e_server.py, JWT on): login, role gating, CERT-In workflow, trace, governance, axe a11y scans
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: logunify-dashboard}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip, cache-dependency-path: logunify-backend/requirements-dev.txt}
      - run: pip install -r ../logunify-backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: logunify-dashboard/package-lock.json}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            logunify-dashboard/playwright-report
            logunify-dashboard/test-results

  stack:
    runs-on: ubuntu-latest
    needs: [backend, dashboard]
    steps:
      - uses: actions/checkout@v4
      - name: Configure (generated secrets, never stored)
        run: |
          {
            echo "LOGUNIFY_VERSION=ci"
            echo "LOGUNIFY_JWT_SECRET=$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
            echo "LOGUNIFY_AUDIT_HMAC_KEY=$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
            echo "LOGUNIFY_PARTITIONS=3"
            echo "LOGUNIFY_RAW_ARCHIVE_ENABLED=true"
            echo "LOGUNIFY_RAW_ARCHIVE_KEY=$(python3 -c 'import os,base64; print(base64.b64encode(os.urandom(32)).decode())')"
          } > .env
      - name: Build and start the full stack (Kafka + backend + dashboard)
        run: docker compose up -d --build --wait --wait-timeout 420
      - name: End-to-end smoke test inside the backend container
        run: docker compose exec -T backend python - < deploy/smoke_test.py
      - name: Dashboard serves, proxies to the backend, and sends its security headers
        run: |
          curl -fsS http://127.0.0.1:3000/ > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/v1/metrics)" = "401"
          curl -sI http://127.0.0.1:3000/ | tee headers.txt
          grep -qi '^content-security-policy:.*frame-ancestors' headers.txt
          grep -qi '^x-frame-options: DENY' headers.txt
          ! grep -qi '^x-powered-by' headers.txt
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Tear down
        if: always()
        run: docker compose down -v

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - name: Python dependency vulnerabilities (hash-pinned lock)
        run: |
          pip install pip-audit
          pip-audit --require-hashes -r logunify-backend/requirements.lock
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
        working-directory: logunify-dashboard

  images:
    runs-on: ubuntu-latest
    needs: [backend, dashboard]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: backend, context: logunify-backend}
          - {name: dashboard, context: logunify-dashboard}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          load: true
          tags: logunify/${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Image vulnerability scan (Trivy; fails on fixable HIGH/CRITICAL)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.57.1
          image --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed --no-progress -q logunify/${{ matrix.name }}:ci
      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          image: logunify/${{ matrix.name }}:ci
          artifact-name: sbom-${{ matrix.name }}.spdx.json
